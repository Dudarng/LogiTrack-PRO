<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="htmlHead(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title th:text="${title} + ' — LogiTrack Pro'">LogiTrack Pro</title>

    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/css/logitrack.css}">
</head>

<body>

    <header th:fragment="navbar(activeTab)" class="nav">
        <div class="brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 6h12v10H2zM14 9h4l4 4v3h-8"></path>
                <circle cx="6" cy="18" r="2"></circle>
                <circle cx="17" cy="18" r="2"></circle>
            </svg>
            <div>&nbsp;Logi<span>Track</span> Pro</div>
        </div>
        <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activeTab == 'dashboard'} ? 'on' : ''">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 11l8-7 8 7v9H4z"></path>
            </svg>
            Dashboard
        </a>
        <a th:href="@{/manutencoes}" class="nav-link" th:classappend="${activeTab == 'manutencoes'} ? 'on' : ''">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 7l3-3 3 3-3 3zM4 20l9-9M3 17l4 4"></path>
            </svg>
            Agendamento
        </a>
        <div class="nav-spacer"></div>
        <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-pressed="true"
            aria-label="Modo escuro" title="Alternar tema claro/escuro">
            <span class="i-sun">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path
                        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4">
                    </path>
                </svg>
            </span>
            <span class="i-moon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path>
                </svg>
            </span>
        </button>
        <div class="user" th:if="${usuarioLogado != null}">
            <span class="avatar"
                th:text="${#strings.isEmpty(usuarioLogado) ? '?' : #strings.toUpperCase(#strings.substring(usuarioLogado, 0, 1))}">A</span>
            <span th:text="${usuarioLogado}">admin</span>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="nav-link" aria-label="Sair">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"></path>
                </svg>
                Sair
            </button>
        </form>
    </header>

    <footer th:fragment="footer" style="display:none"></footer>
    <th:block th:fragment="scripts"></th:block>

</body>

</html>
