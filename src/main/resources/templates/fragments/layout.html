<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - LogiTrack Pro'">LogiTrack Pro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .main-content {
            flex: 1 0 auto;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border-radius: 0.5rem;
        }
        .table th {
            font-weight: 600;
            background-color: #f1f3f5;
        }
        .badge-status-PENDENTE {
            background-color: #ffc107;
            color: #000;
        }
        .badge-status-EM_REALIZACAO {
            background-color: #0dcaf0;
            color: #000;
        }
        .badge-status-CONCLUIDA {
            background-color: #198754;
            color: #fff;
        }
    </style>
</head>
<body>

<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-truck text-primary me-2"></i>LogiTrack <span class="text-white">Pro</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'dashboard'} ? ' active fw-semibold' : ''" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'manutencoes'} ? ' active fw-semibold' : ''" th:href="@{/manutencoes}">
                        <i class="bi bi-tools me-1"></i>Agendamento de Manutenção
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-muted" href="#" tabindex="-1" aria-disabled="true" title="Disponível em breve">
                        <i class="bi bi-map me-1"></i>Viagens
                    </a>
                </li>
            </ul>
            <div th:if="${usuarioLogado != null}" class="d-flex align-items-center gap-3 ms-lg-3">
                <span class="navbar-text small text-light d-flex align-items-center">
                    <i class="bi bi-person-circle text-primary me-2 fs-6"></i>
                    <span class="text-white fw-semibold" th:text="${usuarioLogado}">admin</span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger py-1 px-2" title="Encerrar sessão">
                        <i class="bi bi-box-arrow-right me-1"></i>Sair
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="footer mt-auto py-3 bg-white border-top text-center text-muted small">
    <div class="container">
        <span>LogiTrack Pro &copy; 2026 - Gestão Eficiente de Frotas e Manutenções</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
