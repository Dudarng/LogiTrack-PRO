<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LogiTrack Pro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f3f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }
        .login-header {
            background: #212529;
            color: #ffffff;
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .login-brand {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container p-3">
    <div class="row justify-content-center">
        <div class="col-12 d-flex justify-content-center">
            <div class="card login-card">
                
                <!-- Cabeçalho do Card -->
                <div class="login-header">
                    <div class="login-brand mb-1 text-primary">
                        <i class="bi bi-truck me-2"></i>LogiTrack <span class="text-white">Pro</span>
                    </div>
                    <small class="text-white-50">Sistema Integrado de Gestão de Frotas</small>
                </div>

                <!-- Corpo do Card -->
                <div class="card-body p-4">
                    <h5 class="card-title fw-bold text-dark text-center mb-4">Acesso ao Sistema</h5>

                    <!-- Alerta de Erro de Autenticação -->
                    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center py-2 px-3 mb-3 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2 fs-6"></i>
                        <div>Credenciais inválidas. Verifique seu usuário e senha e tente novamente.</div>
                    </div>

                    <!-- Alerta Informativo de Logout -->
                    <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center py-2 px-3 mb-3 small" role="alert">
                        <i class="bi bi-info-circle-fill flex-shrink-0 me-2 fs-6"></i>
                        <div>Você foi desconectado com sucesso.</div>
                    </div>

                    <!-- Formulário de Autenticação -->
                    <form th:action="@{/login}" method="post">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold small text-secondary">Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary border-end-0">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" 
                                       id="username" 
                                       name="username" 
                                       class="form-control border-start-0 ps-0" 
                                       placeholder="Digite seu usuário" 
                                       required 
                                       autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small text-secondary">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary border-end-0">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" 
                                       id="password" 
                                       name="password" 
                                       class="form-control border-start-0 ps-0" 
                                       placeholder="Digite sua senha" 
                                       required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
