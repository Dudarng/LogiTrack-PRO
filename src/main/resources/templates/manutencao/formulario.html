<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: htmlHead(${modoEdicao} ? 'Editar Manutenção' : 'Novo Agendamento')}"></head>

<body>
  <div class="app">
    <header th:replace="~{fragments/layout :: navbar('manutencoes')}"></header>
    <main class="main">
      <div class="top">
        <div>
          <h1 th:text="${modoEdicao} ? 'Editar Agendamento #' + ${manutencaoId} : 'Novo Agendamento'">Novo Agendamento
          </h1>
          <div class="sub">Preencha os dados da ordem de serviço.</div>
        </div>
      </div>
      <form class="panel" method="post"
        th:action="${modoEdicao} ? @{/manutencoes/{id}(id=${manutencaoId})} : @{/manutencoes}"
        th:object="${manutencaoRequest}" style="max-width:760px" novalidate>

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-err" role="alert" style="margin-bottom:18px">
          <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro na operação</div>
        </div>
        <div class="form-grid">
          <div class="field full">
            <label for="veiculo">Veículo <span style="color:var(--err-fg)">*</span></label>
            <select class="input" id="veiculo" th:field="*{veiculoId}"
              th:classappend="${#fields.hasErrors('veiculoId')} ? 'is-invalid'" required>
              <option value="">Selecione…</option>
              <option th:each="v : ${veiculos}" th:value="${v.id}" th:text="${v.descricaoCompleta}">ABC-1234 · Fiorino
                (Leve)</option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('veiculoId')}" th:errors="*{veiculoId}"></div>
          </div>
          <div class="field">
            <label for="ini">Data de início <span style="color:var(--err-fg)">*</span></label>
            <input class="input" id="ini" type="date" th:field="*{dataInicio}"
              th:classappend="${#fields.hasErrors('dataInicio')} ? 'is-invalid'" required>
            <div class="field-error" th:if="${#fields.hasErrors('dataInicio')}" th:errors="*{dataInicio}"></div>
          </div>
          <div class="field">
            <label for="fim">Finalização prevista</label>
            <input class="input" id="fim" type="date" th:field="*{dataFinalizacao}"
              th:classappend="${#fields.hasErrors('dataFinalizacao')} ? 'is-invalid'" aria-describedby="fim-err">
            <div class="field-error" id="fim-err" th:if="${#fields.hasErrors('dataFinalizacao')}"
              th:errors="*{dataFinalizacao}"></div>
          </div>
          <div class="field full">
            <label for="srv">Tipo de serviço <span style="color:var(--err-fg)">*</span></label>
            <input class="input" id="srv" th:field="*{tipoServico}" placeholder="Ex.: Troca de pneus" maxlength="100"
              th:classappend="${#fields.hasErrors('tipoServico')} ? 'is-invalid'" required>
            <div class="field-error" th:if="${#fields.hasErrors('tipoServico')}" th:errors="*{tipoServico}"></div>
          </div>
          <div class="field">
            <label for="custo">Custo estimado (R$)</label>
            <input class="input" id="custo" type="number" step="0.01" min="0" th:field="*{custoEstimado}"
              placeholder="0,00" th:classappend="${#fields.hasErrors('custoEstimado')} ? 'is-invalid'">
            <div class="field-error" th:if="${#fields.hasErrors('custoEstimado')}" th:errors="*{custoEstimado}"></div>
          </div>
          <div class="field">
            <label for="status">Status <span style="color:var(--err-fg)">*</span></label>
            <select class="input" id="status" th:field="*{status}"
              th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
              <option value="">Selecione…</option>
              <option th:each="st : ${statusList}" th:value="${st.name()}" th:text="${st.descricao}">Pendente</option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn btn-ghost" th:href="@{/manutencoes}">Cancelar</a>
          <button class="btn" type="submit"
            th:text="${modoEdicao} ? 'Atualizar agendamento' : 'Salvar agendamento'">Salvar agendamento</button>
        </div>
      </form>
    </main>
  </div>
</body>

</html>
