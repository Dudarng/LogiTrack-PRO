<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${modoEdicao} ? 'Editar Manutenção' : 'Novo Agendamento')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('manutencoes')}"></nav>

<main class="main-content py-4">
    <div class="container" style="max-width: 760px;">

        <!-- Navegação / Breadcrumb -->
        <div class="mb-3">
            <a th:href="@{/manutencoes}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left me-1"></i>Voltar para a listagem
            </a>
        </div>

        <!-- Card do Formulário -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h2 class="h5 fw-bold mb-0 text-dark">
                    <i class="bi bi-calendar-plus text-primary me-2" th:if="${!modoEdicao}"></i>
                    <i class="bi bi-pencil-square text-primary me-2" th:if="${modoEdicao}"></i>
                    <span th:text="${modoEdicao} ? 'Editar Agendamento #' + ${manutencaoId} : 'Novo Agendamento de Manutenção'"></span>
                </h2>
                <small class="text-muted">Preencha os dados da manutenção e confirme as informações da ordem de serviço.</small>
            </div>
            <div class="card-body p-4">

                <form th:action="${modoEdicao} ? @{/manutencoes/{id}(id=${manutencaoId})} : @{/manutencoes}" 
                      th:object="${manutencaoRequest}" 
                      method="post" 
                      novalidate>

                    <!-- Alerta de Erros Globais -->
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger shadow-sm py-2 mb-3" role="alert">
                        <ul class="mb-0 ps-3">
                            <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</li>
                        </ul>
                    </div>

                    <!-- Veículo -->
                    <div class="mb-3">
                        <label for="veiculoId" class="form-label fw-semibold">
                            Veículo <span class="text-danger">*</span>
                        </label>
                        <select id="veiculoId" 
                                th:field="*{veiculoId}" 
                                class="form-select" 
                                th:classappend="${#fields.hasErrors('veiculoId')} ? 'is-invalid'">
                            <option value="">-- Selecione o Veículo da Frota --</option>
                            <option th:each="v : ${veiculos}" 
                                    th:value="${v.id}" 
                                    th:text="${v.descricaoCompleta}">
                                ABC-1234 - Fiorino (Leve)
                            </option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{veiculoId}"></div>
                    </div>

                    <!-- Datas (Início e Previsão de Término) -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="dataInicio" class="form-label fw-semibold">
                                Data de Início <span class="text-danger">*</span>
                            </label>
                            <input type="date" 
                                   id="dataInicio" 
                                   th:field="*{dataInicio}" 
                                   class="form-control" 
                                   th:classappend="${#fields.hasErrors('dataInicio')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{dataInicio}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="dataFinalizacao" class="form-label fw-semibold">
                                Data de Finalização / Previsão
                            </label>
                            <input type="date" 
                                   id="dataFinalizacao" 
                                   th:field="*{dataFinalizacao}" 
                                   class="form-control" 
                                   th:classappend="${#fields.hasErrors('dataFinalizacao')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{dataFinalizacao}"></div>
                            <div class="form-text small">Deixe em branco para manutenções em aberto.</div>
                        </div>
                    </div>

                    <!-- Tipo de Serviço -->
                    <div class="mb-3">
                        <label for="tipoServico" class="form-label fw-semibold">
                            Tipo de Serviço <span class="text-danger">*</span>
                        </label>
                        <input type="text" 
                               id="tipoServico" 
                               th:field="*{tipoServico}" 
                               class="form-control" 
                               placeholder="Ex: Troca de Pneus, Revisão de Freios, Troca de Óleo" 
                               maxlength="100"
                               th:classappend="${#fields.hasErrors('tipoServico')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{tipoServico}"></div>
                    </div>

                    <!-- Custo Estimado e Status -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="custoEstimado" class="form-label fw-semibold">
                                Custo Estimado (R$) <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">R$</span>
                                <input type="number" 
                                       step="0.01" 
                                       min="0" 
                                       id="custoEstimado" 
                                       th:field="*{custoEstimado}" 
                                       class="form-control" 
                                       placeholder="0.00"
                                       th:classappend="${#fields.hasErrors('custoEstimado')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{custoEstimado}"></div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="status" class="form-label fw-semibold">
                                Status da Manutenção <span class="text-danger">*</span>
                            </label>
                            <select id="status" 
                                    th:field="*{status}" 
                                    class="form-select" 
                                    th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                                <option th:each="s : ${statusList}" 
                                        th:value="${s}" 
                                        th:text="${s.descricao}">Pendente</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{status}"></div>
                        </div>
                    </div>

                    <hr class="my-4 text-muted">

                    <!-- Botões de Ação -->
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/manutencoes}" class="btn btn-outline-secondary px-4">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary px-4 shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i>Salvar Agendamento
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
