<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Novo Agendamento — LogiTrack Pro</title>
<!-- theme.js: SÍNCRONO e ANTES do CSS/corpo, para não piscar no tema errado -->
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/logitrack.css">
</head>
<body><div class="app">
<header class="nav">
  <div class="brand"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h12v10H2zM14 9h4l4 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><div>&nbsp;Logi<span>Track</span> Pro</div></div>
  <a href="dashboard.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Dashboard</a>
  <a href="manutencao.html" class="nav-link on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 7l3-3 3 3-3 3zM4 20l9-9M3 17l4 4"/></svg>Agendamento</a>
  <div class="nav-spacer"></div>
  <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-pressed="true" aria-label="Modo escuro" title="Alternar tema claro/escuro"><span class="i-sun"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="i-moon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></span></button>
  <div class="user"><span class="avatar">A</span>admin</div>
  <!-- no Spring: <form th:action="@{/logout}" method="post"> com este botão (CSRF) -->
  <form><button type="submit" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>Sair</button></form>
</header>
<main class="main">
  <div class="top"><div><h1>Novo Agendamento</h1>
    <div class="sub">Preencha os dados da ordem de serviço. (Tela derivada: não estava no design original.)</div></div></div>
  <form class="panel" method="post" action="#" style="max-width:760px">
    <!-- Erro geral de regra de negócio (BindingResult.reject): -->
    <div class="alert alert-err" role="alert" style="margin-bottom:18px">A data de finalização não pode ser anterior à data de início.</div>
    <div class="form-grid">
      <div class="field full"><label for="veiculo">Veículo</label>
        <select class="input" id="veiculo" name="veiculoId" required>
          <option value="">Selecione…</option><option>ABC-1234 · Fiorino (Leve)</option><option>XYZ-9876 · Volvo FH (Pesado)</option></select></div>
      <div class="field"><label for="ini">Data de início</label><input class="input" id="ini" type="date" name="dataInicio" required></div>
      <div class="field"><label for="fim">Finalização prevista</label>
        <input class="input is-invalid" id="fim" type="date" name="dataFinalizacao" aria-invalid="true" aria-describedby="fim-err">
        <div class="field-error" id="fim-err">Deve ser igual ou posterior à data de início.</div></div>
      <div class="field full"><label for="srv">Tipo de serviço</label><input class="input" id="srv" name="tipoServico" placeholder="Ex.: Troca de pneus" required></div>
      <div class="field"><label for="custo">Custo estimado (R$)</label><input class="input" id="custo" type="number" step="0.01" min="0" name="custoEstimado" required></div>
      <div class="field"><label for="status">Status</label>
        <select class="input" id="status" name="status"><option>Pendente</option><option>Em Realização</option><option>Concluída</option></select></div>
    </div>
    <div class="form-actions"><a class="btn btn-ghost" href="manutencao.html">Cancelar</a><button class="btn" type="submit">Salvar agendamento</button></div>
  </form>
</main></div></body></html>
