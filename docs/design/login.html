<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Login — LogiTrack Pro</title>
<!-- theme.js: SÍNCRONO e ANTES do CSS/corpo, para não piscar no tema errado -->
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/logitrack.css">
</head>
<body>
<button type="button" class="icon-btn theme-toggle theme-toggle-float" data-theme-toggle aria-pressed="true" aria-label="Modo escuro" title="Alternar tema claro/escuro"><span class="i-sun"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="i-moon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></span></button>
<main class="login-page">
  <div class="login-box">
    <div class="login-brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h12v10H2zM14 9h4l4 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>LogiTrack<span>PRO</span></div>
    <form class="panel login-card" method="post" action="#">
      <div><h1>Acesso ao Sistema</h1><div class="sub">Sistema Integrado de Gestão de Frotas</div></div>
      <!-- ESTADOS (derivados; não estavam no design). Exibir um por vez:
      <div class="alert alert-err" role="alert">Usuário ou senha inválidos.</div>
      <div class="alert alert-ok" role="status">Você saiu do sistema.</div> -->
      <div class="field"><label for="u">Usuário</label>
        <input class="input" id="u" name="username" placeholder="Digite seu usuário" autocomplete="username" required></div>
      <div class="field"><label for="s">Senha</label>
        <input class="input" id="s" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required></div>
      <button class="btn" style="height:40px" type="submit">Entrar</button>
    </form>
  </div>
</main>
</body></html>
